<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>ALFS CRM 레이아웃 점검</title>
<style>
  body{margin:0;background:#d8dde5;font-family:system-ui,sans-serif}
  .wrap{display:flex;gap:16px;padding:12px;align-items:flex-start}
  .col{background:#fff;border:1px solid #9aa5b5;border-radius:8px;overflow:hidden}
  .cap{font:700 12px/1.4 system-ui;padding:6px 8px;background:#0B1B33;color:#fff}
  iframe{border:0;display:block;background:#fff}
  #m{width:390px;height:844px}
  #d{width:1440px;height:900px}
</style>
</head>
<body>
<div class="wrap">
  <div class="col"><div class="cap">모바일 390px</div><iframe id="m" src="./"></iframe></div>
  <div class="col"><div class="cap">데스크톱 1440px</div><iframe id="d" src="./"></iframe></div>
</div>
<script>
window.__frameReport = function(frame){
  const f = document.getElementById(frame);
  const doc = f.contentDocument, win = f.contentWindow;
  const w = doc.documentElement.clientWidth;
  let max = 0, worst = '';
  doc.querySelectorAll('body *').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width > 0 && r.right > max) { max = r.right; worst = el.tagName + '.' + (el.className || ''); }
  });
  return { frame, viewport: w, contentRight: Math.round(max), overflow: Math.round(max - w), worst, scrollWidth: doc.documentElement.scrollWidth };
};
</script>
</body>
</html>
