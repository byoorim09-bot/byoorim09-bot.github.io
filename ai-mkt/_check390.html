<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>390px 확인용 (임시)</title>
<style>
  html,body{margin:0;background:#8f96a3}
  .frame{margin:0 auto;background:#fff}
  iframe{display:block;border:0}
</style></head>
<body>
<div class="frame" id="fr"></div>
<script>
  var p = new URLSearchParams(location.search);
  var w = parseInt(p.get('w') || '390', 10);
  var h = parseInt(p.get('h') || '844', 10);
  var src = './index.html';
  var qs = [];
  p.forEach(function (v, k) { if (k !== 'w' && k !== 'h') qs.push(k + '=' + encodeURIComponent(v)); });
  if (qs.length) src += '?' + qs.join('&');
  var fr = document.getElementById('fr');
  fr.style.width = w + 'px';
  var ifr = document.createElement('iframe');
  ifr.width = w; ifr.height = h; ifr.src = src;
  fr.appendChild(ifr);
</script>
</body></html>
